<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ticket — Montevia RP</title>
  <meta name="description" content="Conversation de ticket Montevia.">
  <meta name="theme-color" content="#07080a">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://bylwvlxxvgumvqgpwgod.supabase.co wss://bylwvlxxvgumvqgpwgod.supabase.co; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <link rel="icon" type="image/png" href="img/mark.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body class="ticket-body">

  <div class="ticket-app" id="ticketApp">
    <header class="ticket-header">
      <div class="ticket-header__left">
        <a href="support.html" class="ticket-header__back" title="Retour au support" aria-label="Retour au support">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
        </a>
        <span class="ticket-header__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v3a3 3 0 0 0 0 6v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a3 3 0 0 0 0-6z"/><path d="M13 5v2"/><path d="M13 11v2"/><path d="M13 17v2"/></svg>
        </span>
        <span class="ticket-header__title" id="ticketTitle">Chargement…</span>
        <span class="ticket-header__status" id="ticketStatus" hidden></span>
        <div class="ticket-header__meta" id="ticketMeta"></div>
      </div>
      <div class="ticket-header__right">
        <div class="ticket-header__actions" id="ticketActions"></div>
        <button class="ticket-sidebar-toggle" id="ticketSidebarToggle" type="button" aria-label="Afficher les informations du ticket" aria-expanded="false" aria-controls="ticketSidebar">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        </button>
      </div>
    </header>

    <div class="ticket-main">
      <div class="ticket-chat" id="ticketChat" aria-live="polite">
        <div class="ticket-chat__loading">Chargement de la conversation…</div>
      </div>

      <div class="ticket-sidebar-backdrop" id="ticketSidebarBackdrop" hidden></div>

      <aside class="ticket-sidebar" id="ticketSidebar" aria-label="Informations du ticket">
        <div class="ticket-sidebar__head">
          <h2>Détails du ticket</h2>
          <button class="ticket-sidebar__close" id="ticketSidebarClose" type="button" aria-label="Fermer les informations">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>

        <div class="ticket-sidebar__section">
          <div class="ticket-info" id="ticketInfo"></div>
        </div>

        <div class="ticket-sidebar__section" id="ticketAdminTools" hidden>
          <h3>Gestion staff</h3>
          <label class="ticket-field">
            <span>Catégorie</span>
            <select id="ticketCategorySelect">
              <option value="general">Général</option>
              <option value="bug">Bug</option>
              <option value="question">Question</option>
              <option value="suggestion">Suggestion</option>
              <option value="autre">Autre</option>
            </select>
          </label>
          <label class="ticket-field">
            <span>Priorité</span>
            <select id="ticketPrioritySelect">
              <option value="low">Basse</option>
              <option value="normal">Normale</option>
              <option value="high">Haute</option>
            </select>
          </label>
          <form class="ticket-add-participant" id="addParticipantForm">
            <label class="ticket-field">
              <span>Ajouter un participant</span>
              <input id="participantQuery" type="text" maxlength="120" placeholder="UUID, pseudo Discord ou nom" autocomplete="off">
            </label>
            <button class="btn btn--secondary btn--sm" type="submit">Ajouter</button>
          </form>
        </div>

        <div class="ticket-sidebar__section">
          <h3>Participants</h3>
          <div class="ticket-participants" id="ticketParticipants"></div>
        </div>
      </aside>
    </div>

    <div class="ticket-input" id="ticketInput"></div>
    <div class="ticket-toast" id="ticketToast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="js/vendor/supabase.js?v=15" defer></script>
  <script src="js/supabase-config.js?v=15" defer></script>
  <script src="js/security.js?v=15" defer></script>
  <script src="js/ticket-page.js?v=15" defer></script>
</body>
</html>

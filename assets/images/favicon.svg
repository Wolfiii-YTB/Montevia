<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Fond circulaire sombre -->
  <rect width="64" height="64" rx="16" fill="#070a10" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#blueGlow)" stroke-width="2.5" />
  
  <!-- Rails & Tramway moderne -->
  <path d="M12 48 L52 48" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
  <path d="M16 48 L48 48" stroke="url(#blueGlow)" stroke-width="2" stroke-linecap="round" />
  
  <!-- Fleur de Lys Stylisée Dorée -->
  <g fill="url(#goldGlow)" transform="translate(0, -3)">
    <!-- Pétale central -->
    <path d="M32 14 C33.5 19 35 24 37 27 C34 26 33 28 32 32 C31 28 30 26 27 27 C29 24 30.5 19 32 14 Z" />
    <!-- Pétale gauche -->
    <path d="M25 24 C21 21 16 23 16 28 C16 33 22 35 27 34 C24 32 23 29 25 24 Z" />
    <!-- Pétale droit -->
    <path d="M39 24 C43 21 48 23 48 28 C48 33 42 35 37 34 C40 32 41 29 39 24 Z" />
    <!-- Anneau horizontal -->
    <path d="M21 34 Q32 37 43 34 L43 37 Q32 40 21 37 Z" />
    <!-- Base inférieure -->
    <path d="M26 39 C28 44 32 45 32 45 C32 45 36 44 38 39 Q32 41 26 39 Z" />
  </g>

  <!-- Accent Lumineux Tramway -->
  <circle cx="32" cy="48" r="3" fill="#00f0ff" />
</svg>

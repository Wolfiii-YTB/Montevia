name: Update Roblox stats

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch stats
        run: |
          node -e "
            const uid='10752535690';
            Promise.all([
              fetch('https://games.roblox.com/v1/games?universeIds='+uid).then(r=>r.json()),
              fetch('https://games.roblox.com/v1/games/votes?universeIds='+uid).then(r=>r.json())
            ]).then(([g,v])=>{
              const game=g.data[0];
              const vote=v.data[0];
              const data={
                visits:game.visits,
                playing:game.playing,
                likes:vote.upVotes,
                favorites:game.favoritedCount,
                updated:new Date().toISOString()
              };
              require('fs').writeFileSync('data/stats.json', JSON.stringify(data,null,2));
              console.log(JSON.stringify(data));
            });
          "
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/stats.json
          git diff --cached --quiet || git commit -m "chore: update roblox stats"
          git push
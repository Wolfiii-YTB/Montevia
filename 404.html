<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Montevia RP</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <link rel="icon" type="image/png" href="img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=16">
  <style>
    .notfound { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; }
    .notfound__code { font-size: clamp(80px, 20vw, 160px); font-weight: 700; line-height: 1; color: var(--accent, #35d39a); margin: 0; }
    .notfound__title { font-size: 24px; margin: 16px 0 8px; }
    .notfound__text { color: var(--text-3, #999); max-width: 480px; margin: 0 auto 24px; }
    .notfound__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="notfound">
    <div>
      <p class="notfound__code">404</p>
      <h1 class="notfound__title">Page introuvable</h1>
      <p class="notfound__text">La page que vous cherchez n'existe pas ou a été déplacée. Retournez à l'accueil pour continuer votre visite de Montevia.</p>
      <div class="notfound__actions">
        <a class="btn btn--primary" href="index.html">Retour à l'accueil</a>
        <a class="btn btn--secondary" href="support.html">Contacter le support</a>
      </div>
    </div>
  </main>
  <script src="js/security.js?v=16" defer></script>
</body>
</html>
